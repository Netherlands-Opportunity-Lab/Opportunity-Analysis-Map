# Configuration for the JGZ (youth health care) analysis and export scripts in
# JGZ/Scripts (map tables, gradients, export bundle). Run them from the
# repository root, e.g.
#   setwd("H:/Opportunity-Analysis-Map"); source("JGZ/Scripts/map/jgz_map_tables.R")
# The preprocessing (cleaning, panel, contact moments, catchment sample) is in
# Opportunity-Preprocessing/src/jgz with config/jgz.yml there.

default:
  settings:
    # Minimum number of observations per published cell (CBS output rule)
    min_cell: 10

    # --- map tables (map/jgz_map_tables.R) ---------------------------------------
    # BMI outlier rule: drop |z| > this, z computed within contact moment x sex
    bmi_z_max: 5
    # Top-10% BMI flag: 90th percentile within sex (TRUE) or over boys and
    # girls together (FALSE, as Coen's gradient do-file). Bastian (20 Oct):
    # "the whole group" -- confirm which is meant.
    bmi_p90_by_sex: TRUE
    # SDQ cut-offs
    sdq_cutoffs: [11, 14]

    # --- export bundle (export/jgz_export_bundle.R) ------------------------------
    # Organisations whose results are exported in this run (6 LimburgNoord,
    # 7 ZONL, 10 Verian, 12 org12). Permission to publish per organisation:
    # 6, 7 and 10 yes (meetings 21-09 and 20-10-2026); 12 no, never include it.
    # [7, 10] is a selection, not the permission list: it comes from the 2026
    # export script, which only took 7 and 10 (Limburg-Noord was in the
    # 27-03-2025 export). Add 6 when Limburg-Noord should be in the export.
    export_orgs: [7, 10]
    # Also export pooled results (all four organisations together)? Allowed
    # since 17-11-2026, but never shown together with per-organisation results.
    export_pooled: FALSE
    # Also export "excluding organisation X" results for the orgs above?
    export_excl: FALSE

    # --- kaart (kaart/jgz_kaart.R) -------------------------------------------------
    # Kansenkaart method on output/jgz_cohort.rds of the preprocessing: per area
    # and group the outcome is regressed on the parental income percentile and
    # predicted at Low/Mid/High (25/50/75); "all" = the mean. Same function as the
    # national kaart (src/income_parents/*_01_expectation_function_income.R).
    # Only children whose contact for that age was with an organisation in
    # export_orgs are used (org_m<age>); "all" (pooled) areas only when
    # export_pooled is TRUE.
    # export_orgs / export_pooled are also in the Gap repo's config (settings$jgz,
    # JGZ kloof); its JGZ/jgz_kloof.R stops when the two differ.
    # Outcomes: "all" = every y_m<age>_* column of the cohort file, or a list.
    kaart_outcomes: "all"
    # Areas: "org" (organisation of the contact), "pc3", "pc4" (GBA address at
    # the contact used for that age: pc3_m<age>, pc4_m<age>)
    kaart_region_types: ["org", "pc3", "pc4"]
    # Groups, as in the national grid (src/income_parents/*_02_create_grid_income.R).
    # Every combination is estimated for every area, so each extra group
    # multiplies the run time; most PC4 cells of a split fail the CBS rules.
    kaart_income_groups: ["all", "Low", "Mid", "High"]
    kaart_gender_groups: ["all", "Men", "Women"]
    kaart_migration_groups: ["all"]
    kaart_household_groups: ["all"]
    kaart_conf_level: 0.95
    # CBS output rules, as in the national post-processing
    # (src/income_parents/*_05_post_process_income.R): N >= 11 for a mean,
    # N >= 12 for a regression (degrees of freedom), binary outcomes
    # est * N >= 10 and (1 - est) * N >= 10, no continuous estimate of exactly
    # 0, N rounded to tens.
    kaart_min_n_mean: 11
    kaart_min_n_regression: 12
    kaart_min_count: 10
    kaart_round_n: 10

    # --- bereik (bereik/jgz_bereik.R) ----------------------------------------------
    # Take-up from the catchment sample (jgz_catchment_cohort.rds): share of the
    # children living in the area who were seen by the JGZ, per organisation
    # (catchment area), PC3 and PC4 of the child's address. Same estimate and
    # CBS rules as the kaart (income group "all" only: the catchment sample has
    # no parental income percentile).
    bereik_region_types: ["org", "pc3", "pc4"]
    bereik_gender_groups: ["all"]
    # org_catchment area number (1-4, Coen's Stata file) -> org code (6, 7, 10,
    # 12), so export_orgs applies. The R rebuild (jgz_catchment_cohort.rds)
    # already stores the org codes; bereik_data() then uses them as they are.
    org_catchment_codes: {"1": 6, "2": 7, "3": 10, "4": 12}

  file_locations:
    # Cohort file of the preprocessing (Opportunity-Preprocessing, cohort jgz):
    # one row per child, outcomes y_m<age>_*, pc3/pc4/org per age. Input of the kaart.
    cohort_file: "H:/Opportunity-Preprocessing/output/jgz_cohort.rds"
    # Kaart results (kaart/jgz_kaart.R): estimates before and after the CBS rules
    kaart_folder: "H:/JGZ-Pilot-Data/kaart"
    # Catchment cohort of the preprocessing (cohort jgz_catchment): one row per
    # child living in a catchment area, y_m*_takeup*, org_catchment, postcode_4
    catchment_cohort_file: "H:/Opportunity-Preprocessing/output/jgz_catchment_cohort.rds"
    # Bereik results (bereik/jgz_bereik.R)
    bereik_results_folder: "H:/JGZ-Pilot-Data/bereik"

    # Input from the preprocessing: one .rds per contact moment
    # (Opportunity-Preprocessing config/jgz.yml: contact_moment_folder)
    contact_moment_folder: "H:/JGZ-Pilot-Data/contact_moments"

    # Map tables: BMI / Wiechen / SDQ per PC3 and PC4 (output of the map
    # tables script, input of the export bundle)
    maps_folder: "H:/JGZ-Pilot-Data/Descriptives Results/excel-info-maps"

    # Gradient Excel output (input of the gradient scripts; their tidy and
    # checked versions are written next to it)
    gradients_folder: "H:/JGZ-Pilot-Data/Gradients Analysis Results"

    # Other results bundled for export
    proportions_folder:  "H:/Archive/Sonya/JGZ pilot data/Proportions Results"
    bereik_folder:       "H:/Archive/Sonya/JGZ pilot data/Bereik Regression Results"
    export_descriptives_folder: "H:/Archive/Sonya/JGZ pilot data/Descriptives Results"
    export_folder:       "H:/Archive/Sonya/Export JGZ"
